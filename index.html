<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Flii.app · AI architectuur & apps</title>
    <meta name="description" content="Flii.app ontwerpt en ontwikkelt AI architectuur & apps." />
    <meta name="theme-color" content="#F3F1EB" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Inter:wght@400;500;600&display=swap" />
  </head>
  <body>
    <canvas class="sky" aria-hidden="true"></canvas>

    <header class="top">
      <div class="logo" aria-label="flii.app">flii<svg class="heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.7-9.6-9.2C.9 8.5 2.6 5 6 4.3c2.2-.5 4.4.6 6 2.6 1.6-2 3.8-3.1 6-2.6 3.4.7 5.1 4.2 3.6 7.5C19.5 16.3 12 21 12 21z"/></svg><span>app</span></div>
    </header>

    <main class="hero">
      <h1>AI architectuur als fundament van <span class="hl">resultaat</span></h1>
      <p class="sub">Wij ontwerpen en ontwikkelen AI architectuur &amp; apps.</p>
    </main>

    <div class="cta" data-state="closed">
      <button class="btn cta-btn" type="button" aria-expanded="false" aria-controls="contact">
        <span class="btn-ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path class="shaft" d="M5 12h12"/><path class="head" d="M11 6l6 6-6 6"/></svg></span>
        <span class="btn-t">Plan een gesprek</span>
      </button>
      <section class="panel" id="contact" aria-labelledby="contact-h" hidden>
        <button class="close" type="button" aria-label="Sluiten"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        <h2 id="contact-h">Contact</h2>
        <form novalidate>
          <label>Naam<input name="naam" autocomplete="name" required maxlength="120" /></label>
          <label>E-mail<input name="email" type="email" autocomplete="email" required maxlength="200" /></label>
          <label>Bericht<textarea name="bericht" rows="4" required maxlength="4000"></textarea></label>
          <label class="hp" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off" /></label>
          <button class="btn send" type="submit">
            <span class="btn-ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path class="shaft" d="M5 12h12"/><path class="head" d="M11 6l6 6-6 6"/></svg></span>
            <span class="btn-t">Versturen</span>
          </button>
          <p class="status" role="status" aria-live="polite"></p>
        </form>
        <a class="wa" href="https://wa.me/31640881169" target="_blank" rel="noopener">Of app ons via WhatsApp</a>
      </section>
    </div>

    <script type="module" src="/src/card.js"></script>
  </body>
</html>
