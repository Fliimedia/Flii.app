 Flii Media maakt, komt toe aan Flii Media of aan de betreffende klant. Voor je portfolio kun je in overleg werk tonen, zolang klantgegevens beschermd blijven."],["8. Persoonsgegevens","Flii Media verwerkt je gegevens voor de stageplaatsing en voor de wettelijke verplichtingen die daarbij horen, waaronder de fiscale identificatieplicht. Je kopie identiteitsbewijs wordt uitsluitend daarvoor gebruikt en niet langer bewaard dan nodig. Je kunt je gegevens opvragen, laten corrigeren of laten verwijderen via stage@flii.nl."],["9. Verblijf en werkvergunning","Je bent zelf verantwoordelijk voor een geldige verblijfstitel en, waar vereist, een werk- of stagevergunning. Flii Media kan hierin ondersteunen maar kan geen uitkomst garanderen. Zonder geldige papieren kan de stage niet doorgaan."],["10. Be\xEBindiging","Beide partijen kunnen de stage tussentijds be\xEBindigen, in overleg met je onderwijsinstelling en met een redelijke opzegtermijn. Bij ernstige schending van deze voorwaarden kan de stage per direct eindigen."],["11. Toepasselijk recht","Op deze voorwaarden en op de stageovereenkomst is Nederlands recht van toepassing."]],o:{residenceStatus:[["","Kies"],["eu","EU burger"],["permit","Verblijfsvergunning"],["visa","Studentenvisum"],["applying","Aanvraag loopt"],["other","Anders"]],degreeLevel:[["","Kies"],["mbo","MBO"],["bachelor","Bachelor"],["master","Master"],["postgrad","Postdoctoraal"],["other","Anders"]],internshipDirection:[["","Kies"],["marketing","Digital marketing"],["social","Social media"],["content","Content"],["design","UX en UI design"],["frontend","Frontend development"],["backend","Backend development"],["analytics","Data en analytics"],["ai","AI oplossingen"],["project","Projectmanagement"],["other","Anders"]],workArrangement:[["","Kies"],["onsite","Volledig op kantoor"],["hybrid","Hybride"],["remote","Volledig op afstand"],["parttime","Deeltijd"]],employmentStatus:[["","Kies"],["student","Student zonder inkomen"],["part","Student met bijbaan"],["ful
