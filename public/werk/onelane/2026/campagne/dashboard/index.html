<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>OneLane campagne dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>:root{--flii:#E6007E;--pink:#E8255B;--ink:#16181D;--mist:#5A6068;--dim:#8A9099;--stroke:#E1E4E7;--inset:#F2F3F5;--wash:#F6F7F9;--card:rgba(255,255,255,.88);
--hl:radial-gradient(160px 120px at 10% 0%,rgba(232,37,91,.55),transparent 70%),linear-gradient(140deg,#16181D,#22252C 60%,#101114)}
*{box-sizing:border-box;min-width:0}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;font-family:'Inter',system-ui,-apple-system,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100%;
background:radial-gradient(1000px 640px at 88% -8%,rgba(232,37,91,.08) 0%,transparent 55%),radial-gradient(860px 640px at -8% 108%,rgba(22,24,29,.06) 0%,transparent 55%),var(--wash);
padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.disp{font-family:'Space Grotesk','Inter',system-ui,sans-serif}
.frame{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.topbar{display:flex;align-items:center;gap:12px}
.crumbs{flex:1}
.applogo{font-family:'Space Grotesk','Inter',sans-serif;font-weight:700;font-size:15px;letter-spacing:.02em;white-space:nowrap}
.crumbs .title{font-size:12px;color:var(--mist);margin-top:2px}
.card{background:var(--card);border:1px solid var(--stroke);border-radius:16px;padding:13px 15px;backdrop-filter:blur(10px)}
.h1{font-family:'Space Grotesk','Inter',sans-serif;font-weight:600;font-size:14px}
.h2{font-size:11.5px;color:var(--mist);margin:2px 0 8px}
.h2 b{color:var(--ink);font-weight:600}
.chartbox{width:100%;position:relative}
.axl{font-family:'IBM Plex Mono',monospace;font-size:10px;fill:#8A9099}
.tipt{font-family:'IBM Plex Mono',monospace;font-size:10px;fill:rgba(255,255,255,.7)}
.tipv{font-family:'IBM Plex Mono',monospace;font-size:11px;fill:#fff}
.seg{display:flex;background:var(--inset);border:1px solid var(--stroke);border-radius:999px;padding:3px;gap:2px;width:max-content;max-width:100%;overflow-x:auto}
.seg button{appearance:none;border:none;background:none;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--mist);padding:6px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--ink);color:#fff}
.seghead{margin-bottom:6px}
.brandbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--hl);border:1px solid rgba(232,37,91,.55);box-shadow:0 0 16px rgba(232,37,91,.22);color:#fff;padding:11px 14px}
.blogo{width:44px;height:44px;border-radius:13px;background:var(--pink);display:flex;align-items:center;justify-content:center;flex:none}
.blogo .wm{font-family:'Space Grotesk','Inter',sans-serif;font-weight:700;font-size:18px;color:#fff;letter-spacing:.02em}
.bmeta{display:flex;flex-direction:column;justify-content:center}
.bname{font-weight:700;font-size:15px;line-height:1.2}
.btag{font-weight:500;font-size:11.5px;color:rgba(255,255,255,.85);margin-top:1px}
.bsite{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:rgba(255,255,255,.6);margin-top:1px}
.bspace{flex:1}
.bdesc{font-size:11.5px;color:rgba(255,255,255,.85);text-align:right;line-height:1.5}
.bsrc{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:rgba(255,255,255,.6)}
.hlcard{background:var(--hl);border:1px solid rgba(255,255,255,.14);color:#fff}
.oitems{margin-top:10px}
.ins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 18px}
.oitem{display:flex;gap:10px;padding:6px 4px;align-items:flex-start;border-radius:10px;cursor:pointer}
.oitem:hover{background:rgba(255,255,255,.08)}
.oic{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;background:rgba(255,255,255,.18)}
.oic svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:2.2}
.ot{font-size:12px;font-weight:500;line-height:1.35;word-break:break-word}
.od{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:rgba(255,255,255,.6);margin-top:2px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding:10px 4px}
.kpi{padding:6px 12px;border-radius:10px}
.kclick{cursor:pointer;transition:background .15s}
.kclick:hover{background:var(--inset)}
.kon{background:rgba(232,37,91,.08)}
.kon .kl{color:var(--pink)}
.kl{font-family:'IBM Plex Mono',monospace;font-size:clamp(8px,1.6vw,10px);letter-spacing:.06em;text-transform:uppercase;color:var(--mist);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv{font-weight:700;font-size:clamp(15px,3.4vw,20px);margin-top:5px;white-space:nowrap}
.r3,.r4{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:12px;align-items:start}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:11.5px;min-width:620px}
th{text-align:left;font-family:'IBM Plex Mono',monospace;font-weight:400;font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding:0 7px 7px;border-bottom:1px solid var(--stroke);white-space:nowrap}
th.num,td.num{text-align:right}
td{padding:7px;border-bottom:1px solid var(--inset);white-space:nowrap}
tr:last-child td{border-bottom:none}
th:first-child,td:first-child{position:sticky;left:0;background:#fff;z-index:2;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.cell{display:flex;align-items:center;gap:8px;font-weight:500;overflow:hidden;text-overflow:ellipsis}
.ci{width:18px;height:18px;border-radius:6px;background:rgba(232,37,91,.10);display:flex;align-items:center;justify-content:center;flex:none}
.ci svg{width:10px;height:10px;stroke:var(--pink);fill:none;stroke-width:2.2}
.demrow{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:6px 0}
.glegend{font-size:12px;color:var(--ink);display:flex;flex-direction:column;gap:10px}
.glegend .g{display:grid;grid-template-columns:10px auto;column-gap:8px;align-items:center}
.glegend .gsub{grid-column:2;font-size:10px;color:var(--dim)}
.swatch{width:10px;height:10px;border-radius:3px}
.maprow{display:flex;gap:14px;align-items:center}
.nlmap{width:min(320px,62%);height:auto;flex:none;display:block}
.mapside{flex:1}
.msn{font-weight:700;font-size:16px}
.msv{font-size:12px;color:var(--mist);margin-top:3px}
.blist{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.brow{display:grid;grid-template-columns:minmax(0,130px) 1fr 56px;gap:10px;align-items:center;font-size:12px}
.brow .bname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:400;font-size:12px}
.btrack{height:8px;background:var(--inset);border-radius:999px;overflow:hidden}
.btrack i{display:block;height:100%;background:var(--pink);border-radius:999px}
.bval{text-align:right;font-size:11.5px}
.mapmsg{display:flex;align-items:center;justify-content:center;color:var(--dim);font-family:'IBM Plex Mono',monospace;font-size:11px}
.demoempty{min-height:140px;text-align:center;padding:0 14px;line-height:1.6}
.maphint{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--dim);margin-top:8px}
.fliifoot{display:flex;justify-content:flex-end;align-items:center;gap:9px;padding:8px 4px 0;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.05em;color:var(--mist)}
.brandmark{border-radius:9px;background:var(--flii);display:flex;align-items:center;justify-content:center;flex:none}
.brandmark svg{width:74%;height:74%}
@media(max-width:880px){
body{padding:10px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.r3,.r4{grid-template-columns:1fr}
.ins{grid-template-columns:1fr}
.kpis{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:6px}
.card{padding:12px 13px}
.bdesc{text-align:left;flex-basis:100%}
.bspace{display:none}
}
@media(max-width:420px){.maprow{flex-direction:column;align-items:stretch}.nlmap{width:100%}}
</style>
</head>
