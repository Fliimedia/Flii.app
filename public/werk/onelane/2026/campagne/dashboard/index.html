<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>OneLane campagne dashboard</title>
<script>try{if(localStorage.getItem("ol-theme")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>:root{--flii:#E6007E;--pink:#E8255B;--ink:#16181D;--mist:#5A6068;--dim:#8A9099;--stroke:#E1E4E7;--inset:#F2F3F5;--wash:#F6F7F9;--card:rgba(255,255,255,.9);--solid:#FFFFFF;--segon:#FFFFFF;--segonc:#E8255B;--segsh:0 1px 3px rgba(22,24,29,.10);
--tipbg:#FFFFFF;--tipstroke:#E1E4E7;--tipt:#8A9099;--tipv:#16181D;--grid:rgba(22,24,29,.08);--cursor:rgba(22,24,29,.22);--track:#EEF0F3;
--bg1:rgba(232,37,91,.07);--bg2:rgba(22,24,29,.04);--band:rgba(22,24,29,.035);--pinksoft:rgba(232,37,91,.12);--pinkbar:rgba(232,37,91,.32);color-scheme:light}
:root[data-theme="dark"]{--ink:#ECEEF1;--mist:#A3A9B2;--dim:#7D848E;--stroke:#2A2E36;--inset:#20242B;--wash:#0F1115;--card:#181B21;--solid:#181B21;--segon:#2E333C;--segonc:#FFFFFF;--segsh:none;
--tipbg:#262A32;--tipstroke:#3A3F48;--tipt:#A3A9B2;--tipv:#ECEEF1;--grid:rgba(255,255,255,.08);--cursor:rgba(255,255,255,.25);--track:#262A32;
--bg1:rgba(232,37,91,.10);--bg2:rgba(255,255,255,.02);--band:rgba(255,255,255,.04);--pinksoft:rgba(232,37,91,.18);--pinkbar:rgba(232,37,91,.55);color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;font-family:'Inter',system-ui,-apple-system,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100%;
background:radial-gradient(1000px 640px at 88% -8%,var(--bg1) 0%,transparent 55%),radial-gradient(860px 640px at -8% 108%,var(--bg2) 0%,transparent 55%),var(--wash);
padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.disp{font-family:'Space Grotesk','Inter',system-ui,sans-serif}
.frame{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.topbar{display:flex;align-items:center;gap:10px}
.crumbs{flex:1}
.applogo{font-family:'Space Grotesk','Inter',sans-serif;font-weight:700;font-size:15px;letter-spacing:.02em;white-space:nowrap}
.crumbs .title{font-size:12px;color:var(--mist);margin-top:2px}
.tbtn{appearance:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--stroke);background:var(--inset);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0}
.tbtn svg{width:16px;height:16px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--card);border:1px solid var(--stroke);border-radius:16px;padding:13px 15px;backdrop-filter:blur(10px)}
.h1{font-family:'Space Grotesk','Inter',sans-serif;font-weight:600;font-size:14px}
.h2{font-size:11.5px;color:var(--mist);margin:2px 0 8px}
.h2 b{color:var(--ink);font-weight:600}
.chartbox{width:100%;position:relative}
.axl{font-family:'IBM Plex Mono',monospace;font-size:10px;fill:var(--dim)}
.gridl{stroke:var(--grid)}
.cursorl{stroke:var(--cursor)}
.dotbg{fill:var(--solid)}
.tipbg{fill:var(--tipbg);stroke:var(--tipstroke)}
.tipt{font-family:'IBM Plex Mono',monospace;font-size:10px;fill:var(--tipt)}
.tipv{font-family:'IBM Plex Mono',monospace;font-size:11px;fill:var(--tipv)}
.donuttrack{stroke:var(--track)}
.seg{display:flex;background:var(--inset);border:1px solid var(--stroke);border-radius:999px;padding:3px;gap:2px;width:max-content;max-width:100%;overflow-x:auto}
.seg button{appearance:none;border:none;background:none;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--mist);padding:6px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--segon);color:var(--segonc);box-shadow:var(--segsh)}
.seghead{margin-bottom:6px}
.brandbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 15px}
.ollogo{height:46px;width:161px;display:block;flex:none;object-fit:contain}
.bmeta{display:flex;flex-direction:column;justify-content:center;border-left:1px solid var(--stroke);padding-left:14px}
.bname{font-weight:600;font-size:14px;line-height:1.25}
.bper{font-size:11.5px;color:var(--mist);margin-top:2px}
.logolink{display:block;flex:none}
.bspace{flex:1}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding:10px 4px}
.kpi{padding:6px 12px;border-radius:10px}
.kclick{cursor:pointer;transition:background .15s}
.kclick:hover{background:var(--inset)}
.kon{background:rgba(232,37,91,.08)}
.kon .kl{color:var(--pink)}
.kl{font-family:'IBM Plex Mono',monospace;font-size:clamp(8px,1.6vw,10px);letter-spacing:.06em;text-transform:uppercase;color:var(--mist);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv{font-weight:700;font-size:clamp(15px,3.4vw,20px);margin-top:5px;white-space:nowrap}
.r3,.r4{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:12px;align-items:start}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:11.5px;min-width:620px}
th{text-align:left;font-family:'IBM Plex Mono',monospace;font-weight:400;font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding:0 7px 7px;border-bottom:1px solid var(--stroke);white-space:nowrap}
th.num,td.num{text-align:right}
td{padding:7px;border-bottom:1px solid var(--inset);white-space:nowrap}
tr:last-child td{border-bottom:none}
th:first-child,td:first-child{position:sticky;left:0;background:var(--solid);z-index:2;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.cell{display:flex;align-items:center;gap:8px;font-weight:500;overflow:hidden;text-overflow:ellipsis}
.ci{width:18px;height:18px;border-radius:6px;background:rgba(232,37,91,.10);display:flex;align-items:center;justify-content:center;flex:none}
.ci svg{width:10px;height:10px;stroke:var(--pink);fill:none;stroke-width:2.2}
.demrow{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:6px 0}
.glegend{font-size:12px;color:var(--ink);display:flex;flex-direction:column;gap:10px}
.glegend .g{display:grid;grid-template-columns:10px auto;column-gap:8px;align-items:center}
.glegend .gsub{grid-column:2;font-size:10px;color:var(--dim)}
.swatch{width:10px;height:10px;border-radius:3px}
.blist{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.brow{display:grid;grid-template-columns:minmax(0,130px) 1fr 56px;gap:10px;align-items:center;font-size:12px}
.brow .bname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:400;font-size:12px}
.btrack{height:8px;background:var(--inset);border-radius:999px;overflow:hidden}
.btrack i{display:block;height:100%;background:var(--pink);border-radius:999px}
.bval{text-align:right;font-size:11.5px}
.mapmsg{display:flex;align-items:center;justify-content:center;color:var(--dim);font-family:'IBM Plex Mono',monospace;font-size:11px}
.demoempty{min-height:140px;text-align:center;padding:0 14px;line-height:1.6}
.maphint{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--dim);margin-top:8px}
.maplist{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.mstat{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px solid var(--inset)}
.fliifoot{display:flex;justify-content:flex-end;align-items:center;gap:9px;padding:8px 4px 0;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.05em;color:var(--mist)}
.brandmark{border-radius:9px;background:var(--flii);display:flex;align-items:center;justify-content:center;flex:none}
.brandmark svg{width:74%;height:74%}
@media(max-width:880px){
body{padding:10px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.r3,.r4{grid-template-columns:1fr}
.kpis{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:6px}
.card{padding:12px 13px}
.bspace{display:none}
}
@media(max-width:520px){.bmeta{border-left:none;padding-left:0;flex-basis:100%}.ollogo{height:40px;width:140px}}
html{scroll-behavior:smooth}
.bandbg{fill:var(--band)}
.markline{stroke:var(--cursor)}
.markl{font-family:'IBM Plex Mono',monospace;font-size:9px;fill:var(--dim);letter-spacing:.04em}
.blink{display:flex;align-items:center;gap:7px;border-left:1px solid var(--stroke);padding:6px 0 6px 14px;font-size:12px;font-weight:500;color:var(--ink);text-decoration:none}
.blink svg{width:15px;height:15px;fill:none;stroke:var(--pink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.blink:hover{color:var(--pink)}
#planning{scroll-margin-top:12px}
@media(max-width:880px){.bspace+.blink{border-left:none;padding-left:0}}
.pg{--lw:210px;--gap:16px;position:relative;margin-top:14px}
.pr{display:grid;grid-template-columns:var(--lw) minmax(0,1fr);column-gap:var(--gap);border-top:1px solid var(--inset)}
.ph{border-top:none;padding-top:22px}
.pax{display:grid;grid-template-columns:repeat(var(--wk),minmax(0,1fr));border-bottom:1px solid var(--stroke)}
.pw{display:flex;flex-direction:column;gap:1px;padding:0 0 6px 6px;border-left:1px solid var(--stroke)}
.pw b{font-weight:500;font-size:10px;color:var(--ink)}
.pw span{font-size:9px;color:var(--dim)}
.pl{padding:12px 0}
.pn{font-weight:600;font-size:13px;line-height:1.25}
.pm{font-size:11px;color:var(--mist);margin-top:2px;line-height:1.35}
.pb{font-size:10px;color:var(--pink);margin-top:3px}
.pt{display:flex;flex-direction:column;justify-content:center;gap:10px;padding:12px 0;background:linear-gradient(90deg,var(--inset) 1px,transparent 1px) 0 0/calc(100%/var(--wk)) 100% repeat-x}
.pln{position:relative;height:22px}
.pbr{position:absolute;bottom:0;height:5px;border-radius:3px;background:var(--pinkbar)}
.pbr.fl{background:var(--pink)}
.pcap{position:absolute;left:0;bottom:9px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--mist);white-space:nowrap;background:var(--solid);padding-right:4px;position:absolute;z-index:1}
.pbr.fl .pcap{color:var(--ink)}
.pov{position:absolute;top:0;bottom:0;left:calc(var(--lw) + var(--gap));right:0;pointer-events:none}
.pmk{position:absolute;top:0;bottom:0;border-left:1px dashed var(--pink);opacity:.9}
.pmk span{position:absolute;top:0;left:0;transform:translateX(-50%);width:17px;height:17px;border-radius:50%;background:var(--solid);border:1.5px solid var(--pink);color:var(--pink);font-size:9.5px;font-weight:500;display:flex;align-items:center;justify-content:center;pointer-events:auto}
.pleg{margin-top:14px;padding-top:12px;border-top:1px solid var(--stroke)}
.plg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 24px;margin-top:8px}
.pli{display:grid;grid-template-columns:17px 76px minmax(0,1fr);gap:8px;align-items:baseline;font-size:12px}
.pnum{width:17px;height:17px;border-radius:50%;border:1.5px solid var(--pink);color:var(--pink);font-size:9.5px;display:flex;align-items:center;justify-content:center;align-self:center}
.pdt{font-size:10px;color:var(--dim)}
@media(max-width:700px){
.pg{--lw:92px;--gap:10px}
.pw span{display:none}
.pw{padding-left:3px}
.pm{font-size:10px}
.pcap{font-size:8.5px}
.plg{grid-template-columns:1fr}
}
</style>
</head>
