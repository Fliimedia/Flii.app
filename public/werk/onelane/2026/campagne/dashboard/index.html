<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>OneLane campagne dashboard</title>
<style>:root{--ink:#0A0A0A;--mute:#6B6B6B;--line:#E7E7E7;--red:#E5201B;--bg:#fff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 56px}
.muted{color:var(--mute)}
.small{font-size:13px}
.pad{padding:20px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin-bottom:6px}
h1{margin:0;font-size:28px;line-height:1.1;letter-spacing:-.02em;font-weight:700}
h2{margin:0;font-size:16px;font-weight:600}
.head-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--mute);font:inherit;font-size:13px;font-weight:500;padding:6px 12px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--ink);color:#fff}
.range{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px}
.range label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute)}
.range input{font:inherit;font-size:14px;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;min-width:150px}
.ghost{font:inherit;font-size:14px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;cursor:pointer}
.card{border:1px solid var(--line);border-radius:16px;background:#fff}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:10px}
.kpis.five .kpi:last-child{grid-column:span 2}
.kpi{padding:16px}
.kpi .label{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--mute);margin-bottom:10px}
.kpi .value{font-size:26px;font-weight:700;letter-spacing:-.02em}
.block{padding:18px;margin-bottom:10px}
.block-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bar{height:10px;background:#F1F1F1;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:999px}
.bar.thin{height:4px;margin-top:6px;min-width:80px}
.bar-foot{display:flex;justify-content:space-between;margin-top:10px}
.readout{display:flex;align-items:center;gap:8px;font-size:13px;min-height:20px;margin-bottom:6px}
.scroll{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:620px}
th{text-align:right;font-weight:500;color:var(--mute);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{text-align:right;padding:12px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
th:first-child,td:first-child{text-align:left}
tr:last-child td{border-bottom:0}
td.name{font-weight:600}
@media(min-width:720px){
 .wrap{padding:36px 24px 72px}
 h1{font-size:36px}
 .kpis{grid-template-columns:repeat(4,1fr)}
 .kpis.five{grid-template-columns:repeat(5,1fr)}
 .kpis.five .kpi:last-child{grid-column:auto}
 .block{padding:24px}
}
</style>
</head>
<body>
