<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>Stichting de Buurt | Flii Media</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--pink:#E8255B;--ink:#16181D;--muted:#5A6068;--muted-2:#8A9099;--line:#E1E4E7;}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font-family:Inter,system-ui,sans-serif;
  font-size:15.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.band{height:9px;background:var(--pink)}
.wrap{max-width:820px;margin:0 auto;padding:38px 24px 80px}
.kop{display:flex;align-items:baseline;justify-content:space-between;gap:20px;
  padding-bottom:16px;border-bottom:1px solid var(--ink)}
.kop img{height:26px;width:auto}
.kop .u{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-2)}
.soort{display:flex;align-items:baseline;justify-content:space-between;gap:20px;padding:13px 0 0}
.soort .k{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--pink)}
.soort .nr{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-2)}
h1{font-size:46px;letter-spacing:-2px;line-height:1.02;margin:30px 0 26px;font-weight:800}
ul{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
li{border-bottom:1px solid var(--line)}
li a{display:flex;align-items:baseline;gap:16px;padding:16px 2px}
li a:hover .b{color:var(--pink)}
.b{font-weight:600;min-width:200px}
.d{color:var(--muted);font-size:14.5px}
@media(max-width:700px){.wrap{padding:26px 16px 70px}h1{font-size:30px;letter-spacing:-1.1px}
  li a{display:block;padding:15px 2px}.b{min-width:0;margin-bottom:3px}}
</style>
</head>
<body>
<div class="band"></div>
<div class="wrap">
  <div class="kop"><img src="/assets/doc/fm-logo.png" alt="Flii Media"><span class="u">Stichting de Buurt</span></div>
  <div class="soort"><span class="k">Opdrachtgever</span><span class="nr">Alle jaren</span></div>
  <h1>Stichting<br>de Buurt</h1>
  <ul><li><a href="2027/"><span class="b">2027</span><span class="d">Week tegen Eenzaamheid</span></a></li></ul>
</div>
</body>
</html>
