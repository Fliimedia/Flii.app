<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
<title>Documentatie | Flii Media</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
<style>
:root{
  --ink:#171717; --mag:#E7255A; --paper:#F3F1EB; --card:#FBFAF7; --mist:#EAE7DF;
  --line:#E2DED3; --mid:#5C5A52; --soft:#8B887E; --side:288px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--paper);color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
.display{font-weight:700;letter-spacing:-.022em;line-height:1.1}
button{font-family:inherit;color:inherit}
a{color:inherit;text-decoration:none}

.side{position:fixed;top:0;left:0;bottom:0;width:var(--side);background:var(--card);
  display:flex;flex-direction:column;z-index:40}
.side-top{height:64px;padding:0 14px;display:flex;align-items:center;gap:10px;flex:none}
.mark{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px}
.brand-word{line-height:1;display:inline-flex;align-items:baseline;font-size:20px;font-weight:800;
  letter-spacing:-.02em}
.brand-heart{width:.30em;height:.30em;flex:none;align-self:flex-end;margin:0 .01em .07em}
.brand-dot{color:var(--mag)}
.panel-btn{margin-left:auto;background:none;border:none;cursor:pointer;padding:7px;border-radius:9px;
  display:flex;align-items:center;opacity:.55}
.panel-btn:hover{background:var(--mist);opacity:1}
.panel-btn svg{width:18px;height:18px;stroke:var(--ink);stroke-width:1.6;fill:none}

.nav{flex:1;overflow-y:auto;padding:4px 10px 16px}
.row{width:100%;display:flex;align-items:center;gap:12px;background:none;border:none;cursor:pointer;
  padding:10px 10px;border-radius:10px;font-size:15px;font-weight:500;color:var(--ink);
  text-align:left;line-height:1.35}
.row:hover{background:var(--mist)}
.row.on{background:var(--mist)}
.row svg.ic{width:20px;height:20px;flex:none;stroke:var(--ink);stroke-width:1.7;fill:none;
  stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.row.on svg.ic{stroke:var(--mag);opacity:1}
.chev{margin-left:auto;width:11px;height:11px;stroke:var(--soft);stroke-width:2;fill:none;
  stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.cat.open .chev{transform:rotate(90deg)}
.sub{max-height:0;overflow:hidden;transition:max-height .25s ease}
.cat.open .sub{max-height:560px}
.sub-inner{padding:2px 0 6px 42px}
.sub-btn{display:block;width:100%;text-align:left;background:none;border:none;cursor:pointer;
  padding:8px 10px;border-radius:9px;font-size:14.5px;color:var(--mid);line-height:1.4}
.sub-btn:hover{background:var(--mist);color:var(--ink)}
.sub-btn.active{background:var(--mist);color:var(--ink);font-weight:500}

.side-foot{flex:none;border-top:1px solid var(--line);padding:8px 10px 12px;max-height:52vh;overflow-y:auto}
.side-foot .row{font-size:14.5px;color:var(--mid)}
.side-foot .row svg.ic{width:18px;height:18px;opacity:.7}

.topbar{display:none;position:sticky;top:0;z-index:50;background:var(--card);
  padding:11px 14px;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.burger{background:none;border:none;cursor:pointer;padding:7px;border-radius:9px;display:flex}
.burger svg{width:19px;height:19px;stroke:var(--ink);stroke-width:1.7;fill:none;stroke-linecap:round}
.scrim{display:none;position:fixed;inset:0;background:rgba(23,23,23,.34);z-index:39}

.main{margin-left:var(--side);min-height:100vh;display:flex;flex-direction:column}
.pane{flex:1;padding:56px 56px 90px;max-width:860px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:40px 24px 90px}
.empty h1{font-size:32px;font-weight:600;margin:0 0 10px}
.empty p{color:var(--mid);margin:0;font-size:15px}
.crumb{font-size:13px;color:var(--soft);margin-bottom:10px}
h1.doc{font-size:30px;font-weight:700;margin:0 0 10px}
.lead{color:var(--mid);font-size:15.5px;max-width:62ch;margin:0 0 34px}
.sec-label{font-size:13px;color:var(--soft);margin:0 0 6px}
ol.parts{list-style:none;padding:0;margin:0}
ol.parts li{padding:13px 2px;border-bottom:1px solid var(--line);font-size:15.5px;display:flex;gap:16px}
ol.parts li:first-child{border-top:1px solid var(--line)}
ol.parts li span{color:var(--soft);font-size:13px;width:20px;flex:none;padding-top:2px}
.list{list-style:none;padding:0;margin:0}
.list li{border-bottom:1px solid var(--line)}
.list li:first-child{border-top:1px solid var(--line)}
.list button{width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:15px 4px;
  display:flex;align-items:baseline;gap:14px}
.list button:hover .t{color:var(--mag)}
.list .t{font-size:16px;font-weight:600;flex:none;min-width:200px}
.list .d{font-size:14.5px;color:var(--mid)}
.note{margin-top:36px;font-size:14px;color:var(--mid);border-left:2px solid var(--mist);padding-left:16px}

@media(max-width:900px){
  .side{transform:translateX(-100%);transition:transform .25s ease;width:274px}
  body.nav-open .side{transform:none}
  body.nav-open .scrim{display:block}
  .topbar{display:flex}
  .main{margin-left:0}
  .pane{padding:26px 18px 70px}
  .empty{padding:60px 20px}
  .empty h1{font-size:25px}
  h1.doc{font-size:24px}
  .list button{display:block;padding:14px 2px}
  .list .t{min-width:0;margin-bottom:3px}
}
</style>
</head>
<body>

<div class="scrim" id="scrim"></div>

<div class="topbar">
  <button class="burger" id="burger" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <span class="brand-word">flii<svg class="brand-heart" viewBox="0 0 24 24" aria-hidden><path fill="#E7255A" d="M12 21s-7.5-4.7-9.6-9.2C.9 8.5 2.6 5 6 4.3c2.2-.5 4.4.6 6 2.6 1.6-2 3.8-3.1 6-2.6 3.4.7 5.1 4.2 3.6 7.5C19.5 16.3 12 21 12 21z"/></svg><span class="brand-dot">docs</span></span>
</div>

<aside class="side">
  <div class="side-top">
    <a class="mark" href="#" onclick="goHome();return false;">
      <span class="brand-word">flii<svg class="brand-heart" viewBox="0 0 24 24" aria-hidden><path fill="#E7255A" d="M12 21s-7.5-4.7-9.6-9.2C.9 8.5 2.6 5 6 4.3c2.2-.5 4.4.6 6 2.6 1.6-2 3.8-3.1 6-2.6 3.4.7 5.1 4.2 3.6 7.5C19.5 16.3 12 21 12 21z"/></svg><span class="brand-dot">docs</span></span>
    </a>
    <button class="panel-btn" id="panel" aria-label="Paneel">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
    </button>
  </div>
  <nav class="nav" id="nav"></nav>
  <div class="side-foot" id="foot"></div>
</aside>

<main class="main" id="main"></main>

<script>
var ICONS = {
  pitch:'<path d="M4 4h16v10H4z"/><path d="M12 14v6"/><path d="M8 20h8"/><path d="M7.5 11l2.5-3 2 2.2L15.5 6"/>',
  project:'<path d="M3 6.5A1.5 1.5 0 014.5 5h4l1.6 2H19a1.5 1.5 0 011.5 1.5V18a1.5 1.5 0 01-1.5 1.5H4.5A1.5 1.5 0 013 18z"/><path d="M10.5 11.5v4l3.5-2z"/>',
  year:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/><path d="M7 14h3M7 17.5h3M14 14h3"/>',
  format:'<rect x="2.5" y="5" width="19" height="12" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/><path d="M10 8.5l4 2.5-4 2.5z"/>',
  invoice:'<path d="M5.5 3.5h13v17l-2.2-1.4-2.1 1.4-2.2-1.4-2.1 1.4-2.2-1.4z"/><path d="M14.5 8.5h-4a1.75 1.75 0 000 3.5h2a1.75 1.75 0 010 3.5h-4"/><path d="M12 7v1.5M12 15.5V17"/>',
  home:'<path d="M3.5 11L12 4l8.5 7"/><path d="M6 9.7V20h12V9.7"/><path d="M10 20v-5h4v5"/>',
  book:'<path d="M4 4.5A1.5 1.5 0 015.5 3H19v18H5.5A1.5 1.5 0 014 19.5z"/><path d="M8 3v18"/><path d="M11.5 8h4M11.5 11.5h4"/>'
};

var DATA = [
  { id:'pitches', title:'Pitches', icon:'pitch',
    intro:'Het voorstel richting klant. Basis voor alle formats.',
    items:[
      { id:'pitch', title:'Pitch', desc:'Volledig voorstel: aanleiding, concept en investering.',
        parts:['Aanleiding en vraagstuk','Inzicht en onderbouwing','Concept','Uitwerking','Media inzet','Investering','Planning','Vervolgstappen'] },
      { id:'pitch-inkoop', title:'Pitch media inkoop', desc:'Beknopte variant waarin alleen media inkoop wordt voorgesteld.',
        parts:['Aanleiding','Doelgroep','Voorgestelde kanalen','Plaatsingen','Budgetverdeling','Verwachte resultaten','Planning','Investering'] }
    ]},
  { id:'facturatie', title:'Facturatie', icon:'invoice', onder:true,
    intro:'Van prijsopgave tot betaling, in een vaste vorm.',
    items:[
      { id:'offerte', title:'Offerte', desc:'Prijsopgave met scope, tarieven en geldigheid.',
        parts:['Klant en projectgegevens','Aanleiding en scope','Werkzaamheden','Op te leveren resultaat','Investering en tarieven','Planning','Voorwaarden','Geldigheid en akkoord'] },
      { id:'opdrachtbevestiging', title:'Opdracht bevestiging', desc:'Vastlegging van de verstrekte opdracht.',
        parts:['Klant en projectgegevens','Bevestigde opdracht','Scope en op te leveren werk','Afgesproken tarief','Betaaltermijn','Planning en mijlpalen','Meerwerk en wijzigingen','Ondertekening'] },
      { id:'factuur', title:'Factuur', desc:'Factuur met specificatie en betaalgegevens.',
        parts:['Factuurnummer en datum','Klantgegevens','Projectreferentie','Specificatie werkzaamheden','Bedragen en btw','Totaalbedrag','Betaaltermijn en rekeningnummer','Bedrijfsgegevens, KVK en btw-nummer'] }
    ]},
  { id:'media-projecten', title:'Media projecten', icon:'project',
    intro:'De uitvoerende documentatie per lopend project, van concept tot evaluatie.',
    items:[
      { id:'campagnes', title:'Campagnes', desc:'Het campagneplan van concept tot evaluatie.',
        parts:['Campagne concept','Creatie','Media kanalen','Budgetverdeling','Meetbaarheid en KPI\u0027s','Tijdlijn: voorbespreking','Tijdlijn: livegang','Tijdlijn: tussenrapportages','Tijdlijn: evaluatie'] },
      { id:'media-inkoop', title:'Media inkoop', desc:'Gekozen kanalen, plaatsingen en planning.',
        parts:['Gekozen media kanalen','Plaatsingen','Budgetverdeling','Planning','Voorwaarden en annulering'] },
      { id:'creatief-materiaal', title:'Creatief materiaal', desc:'Materiaalbon met technische specificaties.',
        parts:['Overzicht uitingen','Technische specificaties per kanaal','Formaten en bestandstypen','Aanlevertermijnen','Aanleverkanaal','Controle en akkoord'] },
      { id:'dashboard', title:'Dashboard', desc:'Vaste opzet van het live dashboard.',
        parts:['Doel en gebruikers','Databronnen','KPI\u0027s en definities','Weergaven en filters','Verversingsfrequentie','Toegang'] },
      { id:'rapportage', title:'Rapportage', desc:'Periodieke rapportage tijdens de looptijd.',
        parts:['Samenvatting','Resultaten per kanaal','Voortgang op KPI\u0027s','Bestedingen','Observaties','Optimalisaties','Vooruitblik'] },
      { id:'evaluatie', title:'Evaluatie', desc:'Eindevaluatie na afloop van het project.',
        parts:['Doelstellingen versus resultaat','Resultaten per kanaal','Creatie en materiaal','Budget en efficiency','Wat werkte','Wat kan beter','Aanbevelingen vervolg'] }
    ]},
  { id:'jaarplan', title:'Jaarplan', icon:'year',
    intro:'De jaarlijkse planning: always on, periodieke campagnes en content.',
    items:[
      { id:'marketing-jaarplan', title:'Marketing jaarplan', desc:'Always on plus periodieke campagnes over het hele jaar.',
        parts:['Uitgangspunten','Doelstellingen en targets','Always on inzet','Periodieke campagnes','Content kalender','Budgetverdeling','Meetbaarheid','Tijdlijn: livegang','Tijdlijn: rapportages','Tijdlijn: evaluatie'] },
      { id:'content-kalender', title:'Content kalender', desc:'Formats per maand over het jaar verdeeld.',
        parts:['Uitgangspunten','Formats en rubrieken','Kalender per maand','Kanalen per format','Productie en aanlevering','Meetpunten'] }
    ]},
  { id:'formats', title:'Formats', icon:'format',
    intro:'Conceptvoorstellen per type. Gebaseerd op het pitch document.',
    items:[
      { id:'televisie', title:'Televisie formats', desc:'Formatvoorstel voor televisie.',
        parts:['Logline','Aanleiding','Format','Afleveringsopbouw','Doelgroep','Uitzendvorm','Productie','Vervolgstappen'] },
      { id:'boek', title:'Boek', desc:'Voorstel voor een boekconcept.',
        parts:['Logline','Aanleiding','Concept','Opbouw en hoofdstukken','Doelgroep','Positionering','Productie','Vervolgstappen'] },
      { id:'campagne-concept', title:'Campagne concept', desc:'Het creatieve concept achter een campagne.',
        parts:['Aanleiding','Inzicht','Concept','Uitwerking per kanaal','Doelgroep','Tone of voice','Vervolgstappen'] },
      { id:'content', title:'Content', desc:'Voorstel voor een contentformat.',
        parts:['Aanleiding','Concept','Formats','Kanalen','Frequentie','Productie','Vervolgstappen'] },
      { id:'web-platformen', title:'Web platformen', desc:'Voorstel voor een platform of website.',
        parts:['Aanleiding','Concept','Functionaliteit','Structuur','Techniek','Fasering','Vervolgstappen'] }
    ]}
];

var nav = document.getElementById('nav');
var foot = document.getElementById('foot');
var main = document.getElementById('main');

function ic(n){ return '<svg class="ic" viewBox="0 0 24 24">'+ICONS[n]+'</svg>'; }

function buildNav(){
  DATA.filter(function(c){ return !c.onder; }).forEach(function(cat){ maakCat(cat, nav); });

  DATA.filter(function(c){ return c.onder; }).forEach(function(cat){ maakCat(cat, foot); });
  var extra = document.createElement('div');
  extra.innerHTML =
    '<button class="row" onclick="goHome()">'+ic('home')+'<span>Overzicht</span></button>'+
    '<button class="row" onclick="renderGuide()">'+ic('book')+'<span>Werkwijze</span></button>';
  foot.appendChild(extra);
}

function maakCat(cat, doel){
  var wrap = document.createElement('div');
  wrap.className = 'cat'; wrap.id = 'cat-'+cat.id;
  var btn = document.createElement('button');
  btn.className = 'row';
  btn.innerHTML = ic(cat.icon)+'<span>'+cat.title+'</span>'+
    '<svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';
  btn.onclick = function(){
    if(wrap.classList.contains('open')){ wrap.classList.remove('open'); btn.classList.remove('on'); }
    else { wrap.classList.add('open'); btn.classList.add('on'); renderCat(cat); }
  };
  var sub = document.createElement('div'); sub.className = 'sub';
  var inner = document.createElement('div'); inner.className = 'sub-inner';
  cat.items.forEach(function(it){
    var b = document.createElement('button');
    b.className = 'sub-btn'; b.id = 'sub-'+it.id; b.textContent = it.title;
    b.onclick = function(e){ e.stopPropagation(); renderDoc(cat,it); closeMobile(); };
    inner.appendChild(b);
  });
  sub.appendChild(inner); wrap.appendChild(btn); wrap.appendChild(sub);
  doel.appendChild(wrap);
}

function markActive(id){
  var prev = document.querySelector('.sub-btn.active');
  if(prev) prev.classList.remove('active');
  if(id){ var el = document.getElementById('sub-'+id); if(el) el.classList.add('active'); }
}

function goHome(){
  markActive(null);
  main.innerHTML =
    '<div class="empty"><h1 class="display">Waar wil je beginnen?</h1>'+
    '<p>Kies links een categorie om de documenten te zien.</p></div>';
  window.scrollTo(0,0);
  closeMobile();
}

function openDoc(c,i){
  var cat = DATA.filter(function(x){ return x.id===c; })[0];
  renderDoc(cat, cat.items.filter(function(y){ return y.id===i; })[0]);
}

function renderCat(cat){
  markActive(null);
  var rows = cat.items.map(function(it){
    return '<li><button onclick="openDoc(\u0027'+cat.id+'\u0027,\u0027'+it.id+'\u0027)">'+
      '<span class="t">'+it.title+'</span><span class="d">'+it.desc+'</span></button></li>';
  }).join('');
  main.innerHTML = '<div class="pane"><h1 class="doc display">'+cat.title+'</h1>'+
    '<p class="lead">'+cat.intro+'</p><ul class="list">'+rows+'</ul></div>';
  window.scrollTo(0,0);
}

function renderDoc(cat,it){
  markActive(it.id);
  var parts = it.parts.map(function(p,i){
    var n = (i+1) < 10 ? '0'+(i+1) : ''+(i+1);
    return '<li><span>'+n+'</span>'+p+'</li>';
  }).join('');
  main.innerHTML = '<div class="pane">'+
    '<div class="crumb">'+cat.title+'</div>'+
    '<h1 class="doc display">'+it.title+'</h1>'+
    '<p class="lead">'+it.desc+'</p>'+
    '<p class="sec-label">Opbouw van het document</p>'+
    '<ol class="parts">'+parts+'</ol>'+
    '<p class="note">Dit template wordt opgebouwd zodra het voorbeelddocument is aangeleverd. '+
    'De opbouw hierboven is het voorstel voor de vaste indeling.</p></div>';
  window.scrollTo(0,0);
}

function renderGuide(){
  markActive(null);
  main.innerHTML = '<div class="pane">'+
    '<h1 class="doc display">Werkwijze</h1>'+
    '<p class="lead">Elk document volgt dezelfde opzet en dezelfde huisstijl, zodat een pitch, '+
    'een campagneplan en een evaluatie herkenbaar bij elkaar horen.</p>'+
    '<ol class="parts">'+
    '<li><span>01</span>Voorbeelddocument aanleveren</li>'+
    '<li><span>02</span>Vaste indeling bepalen</li>'+
    '<li><span>03</span>Template opbouwen in huisstijl</li>'+
    '<li><span>04</span>Invullen per project</li>'+
    '</ol></div>';
  window.scrollTo(0,0);
  closeMobile();
}

function closeMobile(){ document.body.classList.remove('nav-open'); }
document.getElementById('burger').onclick = function(){ document.body.classList.toggle('nav-open'); };
document.getElementById('scrim').onclick = closeMobile;
document.getElementById('panel').onclick = function(){ document.body.classList.toggle('nav-open'); };

buildNav();
goHome();
</script>
</body>
</html>
